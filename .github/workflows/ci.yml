# Two sizes of run, because the account's Actions minutes are the scarce resource.
#
# A pull request runs the unit half of the suite, `-m "not render"`: 830 tests in about two
# minutes. A push to main runs everything, the 181 tests that render app.py through AppTest
# included, on both supported Pythons: about ten minutes a job. Until 16 Sep 2026 every pull
# request ran the full suite, which spent the month's minutes in a fortnight. The full suite is
# run locally before every PR in any case (CLAUDE.md); CI on the PR is the fast confirmation and
# CI on main is the complete one.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floors in requirements.txt need 3.11 or newer; see the note there. The floor
        # version is checked on main only.
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests (pull request)
        if: github.event_name == 'pull_request'
        run: pytest -q -m "not render"
      - name: Full suite, renders included (main)
        if: github.event_name == 'push'
        run: pytest -q
