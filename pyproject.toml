[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcwc-builder"
version = "0.0.1"
description = "Builds a hydrocarbon-water contact distribution from competing geological limits"
requires-python = ">=3.11"
# requirements.txt is the canonical list (it is what the deployment installs); these floors
# are kept identical to it and a test checks that they are. matplotlib is used by
# scripts/ only and is a dev dependency.
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "plotly>=5.24",
    "streamlit>=1.56,<1.63",  # ceiling explained in requirements.txt
    "openpyxl>=3.1",
    "kaleido>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Tests that render the whole app through streamlit's AppTest. They are most of the suite's
    # wall time, so a pull request runs everything except them and a push to main runs all.
    "render: renders app.py through AppTest (slow; run on main, not on pull requests)",
]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
    "ignore:.*deprecated.*:UserWarning",
]

[tool.setuptools.packages.find]
include = ["hcwc*"]
