<text x='1020' y='466' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Strength moves the chance and</text>
<text x='1020' y='484' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>never the contact; geometry moves</text>
<text x='1020' y='502' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>the contact and never the chance's</text>
<text x='1020' y='520' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>first factor. Each enters once.</text>
