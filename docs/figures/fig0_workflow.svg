<text x='1020' y='372' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>One weighted sample reads</text>
<text x='1020' y='390' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>the histogram, the percentiles,</text>
