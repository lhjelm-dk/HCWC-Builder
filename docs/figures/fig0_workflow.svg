<text x='1020' y='140' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>POS(h) = P(G) × F(h)</text>
<text x='1020' y='158' text-anchor='middle' font-size='12' fill='#333333' font-family='Segoe UI, Helvetica, Arial, sans-serif'>read at h_min, and at z_entry for the well</text>
